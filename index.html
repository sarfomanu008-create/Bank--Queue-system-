<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Teller Queue System</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f4f6f9; margin:0; padding:16px; color:#1c2430; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:1.4rem; }
  .card { background:#fff; border-radius:10px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  input, select, button { font-size:1rem; padding:10px; border-radius:6px; border:1px solid #c5ccd6; }
  input, select { width:100%; box-sizing:border-box; margin-bottom:8px; }
  button { background:#1f6feb; color:#fff; border:none; cursor:pointer; margin-right:6px; margin-top:4px; }
  button.alt { background:#5b6675; }
  .queue { display:flex; gap:8px; overflow-x:auto; padding:6px 0; min-height:60px; }
  .ticket { background:#e8f0fe; border:1px solid #1f6feb; border-radius:8px; padding:8px 12px; white-space:nowrap; font-size:.9rem; }
  .ticket.front { background:#1f6feb; color:#fff; }
  .label { font-size:.8rem; color:#5b6675; }
  #serving { font-size:1.1rem; font-weight:600; min-height:1.4em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bank Teller Queue System</h1>
  <p class="label">A FIFO queue: the first customer to join is the first one served.</p>

  <div class="card">
    <input id="name" placeholder="Customer name">
    <select id="service">
      <option>Deposit</option>
      <option>Withdrawal</option>
      <option>Account Enquiry</option>
      <option>Loan</option>
    </select>
    <button onclick="joinQueue()">Join queue (enqueue)</button>
  </div>

  <div class="card">
    <div class="label">Now serving</div>
    <div id="serving">-</div>
    <button onclick="callNext()">Call next (dequeue)</button>
    <button class="alt" onclick="showNext()">Who is next? (peek)</button>
    <div id="msg" class="label" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="label">Waiting queue (front on the left)</div>
    <div id="queue" class="queue"></div>
  </div>

  <div class="card">
    <div class="label">Statistics</div>
    <div id="stats"></div>
  </div>
</div>

<script>
  // Linked-list queue, mirroring the Java version
  class LinkedQueue {
    constructor() { this.front = null; this.rear = null; this.size = 0; }
    enqueue(item) {
      const node = { data: item, next: null };
      if (!this.rear) { this.front = this.rear = node; }
      else { this.rear.next = node; this.rear = node; }
      this.size++;
    }
    dequeue() {
      if (!this.front) return null;
      const item = this.front.data;
      this.front = this.front.next;
      if (!this.front) this.rear = null;
      this.size--;
      return item;
    }
    peek() { return this.front ? this.front.data : null; }
    toArray() { const out = []; for (let n = this.front; n; n = n.next) out.push(n.data); return out; }
  }

  const q = new LinkedQueue();
  let nextTicket = 1, served = 0, totalWait = 0;

  function label(c) { return '#' + c.ticket + ' ' + c.name + ' (' + c.service + ')'; }

  function joinQueue() {
    const nameEl = document.getElementById('name');
    const name = nameEl.value.trim();
    if (!name) { setMsg('Please enter a name.'); return; }
    const c = { ticket: nextTicket++, name, service: document.getElementById('service').value, at: Date.now() };
    q.enqueue(c);
    nameEl.value = '';
    setMsg('Ticket issued: ' + label(c) + '. People ahead: ' + (q.size - 1));
    render();
  }

  function callNext() {
    const c = q.dequeue();
    if (!c) { setMsg('No customers waiting.'); return; }
    const waited = Math.round((Date.now() - c.at) / 1000);
    totalWait += waited; served++;
    document.getElementById('serving').textContent = label(c);
    setMsg('Waited ' + waited + 's');
    render();
  }

  function showNext() {
    const c = q.peek();
    setMsg(c ? 'Next in line: ' + label(c) : 'No customers waiting.');
  }

  function setMsg(t) { document.getElementById('msg').textContent = t; }

  function render() {
    const box = document.getElementById('queue');
    box.innerHTML = '';
    const items = q.toArray();
    if (!items.length) box.innerHTML = '<span class="label">(queue is empty)</span>';
    items.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'ticket' + (i === 0 ? ' front' : '');
      d.textContent = label(c);
      box.appendChild(d);
    });
    document.getElementById('stats').textContent =
      'Served: ' + served + ' | Waiting: ' + q.size +
      ' | Average wait: ' + (served ? Math.round(totalWait / served) : 0) + 's';
  }
  render();
</script>
</body>
</html>
